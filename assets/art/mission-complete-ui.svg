<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1664" height="936" viewBox="0 0 1664 936">
  <defs>
    <filter id="glowPink" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 0H4" stroke="#31427d" stroke-opacity=".10"/>
    </pattern>
    <style>
      .pixel { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: 1px; }
      .body { font-family: "Arial", sans-serif; }
    </style>
  </defs>

  <!-- BACKGROUND -->
  <g id="Background">
    <rect width="1664" height="936" fill="#060b20"/>
    <rect x="22" y="28" width="1620" height="880" rx="16" fill="#081333" stroke="#243e86" stroke-width="3"/>
    <rect x="22" y="28" width="1620" height="880" rx="16" fill="url(#scanlines)"/>
    <path d="M44 72H1620 M44 862H1620" stroke="#172c64" stroke-width="2"/>
    <path d="M182 28V908" stroke="#172c64" stroke-width="2"/>
    <path d="M160 80H1605" stroke="#172c64" stroke-dasharray="4 12"/>
  </g>

  <!-- OUTER FRAME -->
  <g id="Frame">
    <path d="M22 48L42 28H1622L1642 48V888L1622 908H42L22 888Z"
          fill="none" stroke="#38549d" stroke-width="3"/>
    <path d="M42 70L58 54H1606L1622 70V866L1606 882H58L42 866Z"
          fill="none" stroke="#111f4d" stroke-width="2"/>
    <path d="M206 74H1588" stroke="#513d91" stroke-width="2"/>
    <path d="M206 846H1588" stroke="#513d91" stroke-width="2"/>
    <g fill="#ff3d9d">
      <rect x="60" y="48" width="8" height="5"/><rect x="82" y="48" width="5" height="5"/>
      <rect x="1490" y="48" width="7" height="5"/><rect x="1510" y="48" width="4" height="5"/>
      <rect x="1560" y="878" width="6" height="4"/><rect x="1580" y="878" width="10" height="4"/>
    </g>
  </g>

  <!-- TOP BAR -->
  <g id="TopBar">
    <text x="258" y="58" class="pixel" font-size="17" fill="#3159a7">STARPORT CONTROL v2.3.1</text>
    <rect x="1530" y="42" width="62" height="36" rx="7" fill="#081333" stroke="#d39b37" stroke-width="2"/>
    <text x="1561" y="67" class="pixel" text-anchor="middle" font-size="19" fill="#ffc44d">5a</text>
  </g>

  <!-- LEFT SIDEBAR -->
  <g id="Left_Sidebar">
    <g id="LTPD_Logo">
      <path d="M84 105L108 82L132 105L108 128Z" fill="#101d4d" stroke="#516db5" stroke-width="3"/>
      <path d="M108 78L113 99L135 103L115 112L108 134L101 112L81 103L103 99Z"
            fill="#6a78bd" stroke="#273b80" stroke-width="2"/>
      <path d="M68 116L87 103L91 112L72 130ZM148 116L129 103L125 112L144 130Z"
            fill="#394d9b"/>
      <text x="108" y="169" class="pixel" text-anchor="middle" font-size="22" fill="#5570bd">LTPD</text>
    </g>
    <g id="Sidebar_Decor">
      <path d="M54 236H160L150 260H64Z" fill="#111f4b"/>
      <path d="M54 270H160L150 294H64Z" fill="#111f4b"/>
      <path d="M54 304H160L150 328H64Z" fill="#111f4b"/>
      <rect x="54" y="215" width="106" height="4" fill="#3c4b88"/>
      <g fill="#283a7b">
        <rect x="55" y="376" width="12" height="12"/><rect x="74" y="376" width="12" height="12"/>
        <rect x="55" y="398" width="12" height="12"/><rect x="74" y="398" width="12" height="12"/>
        <rect x="55" y="420" width="12" height="12"/><rect x="74" y="420" width="12" height="12"/>
      </g>
    </g>
    <g id="Copilot_Message">
      <rect x="42" y="575" width="132" height="286" rx="10" fill="#09163a" stroke="#384e9a" stroke-width="2"/>
      <path d="M60 605Q108 565 156 605L150 652Q108 674 66 652Z" fill="#0d1e4d" stroke="#4b3d91" stroke-width="2"/>
      <!-- pixel cat icon -->
      <path d="M78 628V603L94 614L108 607L122 614L138 603V628L130 646H86Z"
            fill="#090d24" stroke="#6873b5" stroke-width="3"/>
      <circle cx="96" cy="626" r="3" fill="#ff4aa9"/><circle cx="120" cy="626" r="3" fill="#ff4aa9"/>
      <path d="M105 635L111 635" stroke="#8a94cf" stroke-width="2"/>
      <text x="108" y="723" class="pixel" text-anchor="middle" font-size="14" fill="#4c80d5">GOOD WORK,</text>
      <text x="108" y="746" class="pixel" text-anchor="middle" font-size="14" fill="#4c80d5">OFFICER.</text>
      <text x="108" y="779" class="pixel" text-anchor="middle" font-size="24" fill="#ff4aa9">♥</text>
    </g>
  </g>

  <!-- MAIN PANEL -->
  <g id="Main_Panel">
    <rect x="208" y="82" width="1380" height="764" rx="12" fill="#07122f" stroke="#1d3674" stroke-width="2"/>
    <rect x="224" y="98" width="1348" height="732" rx="8" fill="none" stroke="#101f4d" stroke-width="2"/>
  </g>

  <!-- TITLE -->
  <g id="Title">
    <text x="274" y="166" class="pixel" font-size="52" fill="#ff4da9" filter="url(#glowPink)">MISSION COMPLETE</text>
    <text x="274" y="194" class="pixel" font-size="13" fill="#5b69ad">-----------------------------------------------</text>
    <path d="M274 210H1530" stroke="#26366e" stroke-width="2" stroke-dasharray="3 10"/>
  </g>

  <!-- STATS -->
  <g id="Mission_Stats">
    <g id="Distance">
      <path d="M286 252L310 232L328 252L310 270Z" fill="#4e63ae"/>
      <path d="M296 253L308 241L319 253L308 264Z" fill="#172b63"/>
      <text x="365" y="268" class="pixel" font-size="24" fill="#9fb0e8">Distance flown</text>
      <path d="M575 264H1258" stroke="#27386f" stroke-dasharray="2 9"/>
      <text x="1415" y="268" class="pixel" font-size="25" text-anchor="end" fill="#ffc34d">1,240m</text>
    </g>
    <g id="Boosts">
      <text x="286" y="349" class="pixel" font-size="31" fill="#5269b4">»</text>
      <text x="365" y="350" class="pixel" font-size="24" fill="#9fb0e8">Boosts used</text>
      <path d="M555 345H1258" stroke="#27386f" stroke-dasharray="2 9"/>
      <text x="1415" y="350" class="pixel" font-size="25" text-anchor="end" fill="#ffc34d">6</text>
    </g>
    <g id="Near_Misses">
      <circle cx="309" cy="423" r="18" fill="none" stroke="#5269b4" stroke-width="3"/>
      <path d="M309 398V448M284 423H334" stroke="#5269b4" stroke-width="3"/>
      <text x="365" y="432" class="pixel" font-size="24" fill="#9fb0e8">Near-misses dodged</text>
      <path d="M630 427H1258" stroke="#27386f" stroke-dasharray="2 9"/>
      <text x="1415" y="432" class="pixel" font-size="25" text-anchor="end" fill="#ffc34d">3</text>
    </g>
    <g id="Combo">
      <path d="M299 480L322 480L309 501L324 501L296 536L303 512L288 512Z" fill="#ff4da9"/>
      <text x="365" y="515" class="pixel" font-size="24" fill="#20e9ef">Speed combo x2</text>
      <path d="M580 509H1258" stroke="#27386f" stroke-dasharray="2 9"/>
      <text x="1415" y="515" class="pixel" font-size="25" text-anchor="end" fill="#20e9ef">+120</text>
    </g>
  </g>

  <!-- DIVIDER -->
  <g id="Divider">
    <path d="M274 579H1530" stroke="#35447d" stroke-width="2"/>
    <path d="M274 579H1530" stroke="#263566" stroke-width="7" stroke-dasharray="1 14"/>
  </g>

  <!-- REWARD -->
  <g id="Reward">
    <text x="280" y="657" class="pixel" font-size="24" fill="#9fb0e8">Total earned</text>
    <path d="M520 651H1140" stroke="#27386f" stroke-dasharray="2 9"/>
    <text x="1325" y="668" class="pixel" font-size="58" text-anchor="end" fill="#ffc34d">$360</text>
    <rect x="1350" y="627" width="48" height="48" rx="7" fill="#0a1535" stroke="#3f4c88" stroke-width="2"/>
    <text x="1374" y="660" class="pixel" text-anchor="middle" font-size="24" fill="#ffc34d">C</text>
  </g>

  <!-- CONTINUE -->
  <g id="Continue_Button">
    <path d="M700 735L720 715H1000L1020 735V795L1000 815H720L700 795Z"
          fill="#101b43" stroke="#7650a9" stroke-width="3"/>
    <path d="M714 742L728 728H992L1006 742V788L992 802H728L714 788Z"
          fill="none" stroke="#263d82" stroke-width="2"/>
    <text x="850" y="774" class="pixel" text-anchor="middle" font-size="26" fill="#ffc34d">CONTINUE</text>
    <text x="974" y="774" class="pixel" font-size="28" fill="#ffc34d">›</text>
  </g>

  <!-- MICRO UI -->
  <g id="Micro_Decor" opacity=".8">
    <g fill="#334784">
      <rect x="260" y="792" width="8" height="5"/><rect x="274" y="792" width="14" height="5"/>
      <rect x="304" y="792" width="6" height="5"/><rect x="316" y="792" width="18" height="5"/>
      <rect x="1240" y="790" width="8" height="5"/><rect x="1255" y="790" width="20" height="5"/>
      <rect x="1290" y="790" width="6" height="5"/>
    </g>
    <text x="242" y="872" class="pixel" font-size="11" fill="#273b79">SYS_VER 2.1</text>
    <text x="1330" y="872" class="pixel" font-size="11" fill="#273b79">NAV-01 // LTPD</text>
  </g>
</svg>
